
[project]
name = "processkernel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.0",
    "kernelbench",
    "torch",
    "vllm==0.25.1",

]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7", "hypothesis>=6", "gemtest>=1", "pytest-gremlins>=1.9"]

[tool.uv.sources]
kernelbench = { git = "https://github.com/ScalingIntelligence/KernelBench.git" }

[tool.pytest.ini_options]
testpaths = ["checker/tests", "kernel_gen/tests", "reranker/tests"]
# NB: do NOT add "kernel_gen/tests" to pythonpath. It puts a second conftest.py on the
# global path, which shadows checker/tests' own `from conftest import ...`. Both
# tests dirs bootstrap the repo root themselves in their conftest.py, and kernel_gen
# tests keep their shared data local (no bare cross-file imports across the subdirs).
# reranker/tests takes the other route: __init__.py all the way down, so pytest finds the
# repo root itself and no conftest reaches the global path. Do not mix the two per dir.
filterwarnings = [
    # checker/scan.py forks a worker pool by design (mp.get_context("fork")). When
    # the FULL suite is collected, a kernel_gen test module (gemtest / hypothesis) starts
    # a thread at import time first, so the fork trips CPython's fork-after-thread
    # DeprecationWarning. test_scan is verified to run correctly; silence only this one.
    "ignore:This process .* is multi-threaded, use of fork.*:DeprecationWarning",
]

# Coverage is a FLOOR, not the quality bar -- pytest-gremlins (mutation testing) is that.
# --cov is deliberately NOT in addopts so the inner-loop `pytest` stays fast:
#     uv run --group dev pytest --cov --cov-branch
# The sources sit at or near 100% line and branch; the floor is 95 so a real regression
# fails CI. NB: coverage wants dotted module names here, not paths -- a path silently
# reports "module was never imported" and measures nothing.
[tool.coverage.run]
source = [
    "kernel_gen.core", "checker.core", "checker.submission",
    "reranker.src.prm", "reranker.src.data.labels",
]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

