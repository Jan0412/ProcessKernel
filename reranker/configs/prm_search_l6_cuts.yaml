# The B arm: same beam, chunk-depth cadence. Every candidate is truncated to the same cut
# index each step, which is the invariant the PRM's training lists were built under (N4) --
# paid for by discarding whatever each candidate generated past that cut.
_base: prm_search_l6.yaml

prm_search:
  advance: cuts
  segment_max_tokens: 512      # generous, so one 16-line chunk usually fits in one call
  code_steps_per_chunk: 16     # the stride: one chunk = one step = 16 logical lines
  prose_lines_per_chunk: 16
  out_dir: data/prm_search/l6_cuts
