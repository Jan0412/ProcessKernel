# PRM listwise training, Qwen3-0.6B-Base arm. Everything else comes from the base.
#   CONFIG=reranker/configs/prm_train_qwen3base06b.yaml sbatch scripts/prm_train.sh

_base: prm_train_base.yaml

prm_rollout:
  # Set in BOTH places on purpose: check_prm_budgets refuses unless they agree. This one is
  # rank_eval's tokenizer fallback, the one below is what build_backbone loads.
  base_model: Qwen/Qwen3-0.6B-Base

model:
  base_model: Qwen/Qwen3-0.6B-Base

train:
  output_dir: data/checkpoints_prm_qwen3base06b

mlflow:
  run_name: prm_kb6_gptoss_qwen3base06b
