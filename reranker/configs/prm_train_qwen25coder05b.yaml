# PRM listwise training, Qwen2.5-Coder-0.5B arm. Everything else comes from the base.
#   CONFIG=reranker/configs/prm_train_qwen25coder05b.yaml sbatch scripts/prm_train.sh
#
# NB: this backbone is NOT in the cluster HF cache as of 2026-08-15, and prm_train.sh runs
# with HF_HUB_OFFLINE=1 and aborts on a cache miss. Fetch it once from a login node first:
#   hf download Qwen/Qwen2.5-Coder-0.5B

_base: prm_train_base.yaml

prm_rollout:
  # Set in BOTH places on purpose: check_prm_budgets refuses unless they agree. This one is
  # rank_eval's tokenizer fallback, the one below is what build_backbone loads.
  base_model: Qwen/Qwen2.5-Coder-0.5B

model:
  base_model: Qwen/Qwen2.5-Coder-0.5B

train:
  output_dir: data/checkpoints_prm_qwen25coder05b

mlflow:
  run_name: prm_kb6_gptoss_qwen25coder05b
