# Smoke campaign — one part, one round (PLAN_v2 §13 step 5). Every knob that decides what a
# prefix is or how its rollouts are graded matches prm_rollout.yaml, so the smoke output is
# a sample of the real campaign rather than a different one.
#   python -m reranker.src.prm.rollout.prefixes --config reranker/configs/prm_rollout_smoke.yaml
prm_rollout:
  # One part file, not a glob: parts are per (run, shard, round), so naming one is the
  # rollout analogue of prm.max_shards -- and a part holds every sample of its problems,
  # so the groups inside it are whole.
  parts_glob: data/prm_v2/parts/gpt-oss-120b_kb6_lintloop_triton_v5_traced__shard_00__round0.jsonl
  splits_json: data/prm_v2/splits.json

  baseline_timing_json: /path/to/workdir/KernelBench/results/timing/H100/baseline_time_torch.json

  run_tags:
    gpt-oss-120b_kb6_lintloop_triton_v5_traced: go-l6

  source: cut
  rounds: [0]
  depths_per_group: 4
  min_rel_depth: 0.1
  max_rel_depth: 0.9
  min_list_size: 2
  max_list_size: 8
  train_selection: random
  prm_v1_checkpoint: null
  select_seed: 42

  K: 5
  min_rollouts: 3
  temperature: 0.6
  think_temperature: 1.0
  max_new_tokens: 16384
  gen_model: openai/gpt-oss-120b
  max_num_seqs: 64
  max_model_len: 40960
  # Smaller than the real campaign's 256 on purpose: the smoke run is ~24 prefixes, and this
  # is what exercises the multi-batch path at all.
  prefixes_per_batch: 8

  eval_runs_dir: /path/to/workdir/KernelBench/runs
  eval_run_name: prm_rollout_smoke
  eval_shards: 1
  num_correct_trials: 5
  num_perf_trials: 100
  eval_timeout: 300
  dedup_by_code_sha1: true

  label_mode: graded
  speedup_stat: min
  speedup_lo: 0.2
  speedup_hi: 4.0
  speed_quant: 0.1

  base_model: Qwen/Qwen3-Reranker-4B
  max_length: 16384
  depth_buckets: 4

  out_dir: data/prm_rollout_smoke
  num_workers: 1
