# PRM rollout campaign over the gpt-oss KernelBench **level 6** run, round 0 only.
#   python -m reranker.src.prm.rollout.prefixes --config reranker/configs/prm_rollout_l6_r0.yaml
#   CONFIG=reranker/configs/prm_rollout_l6_r0.yaml sbatch scripts/prm_rollout.sh
#
# Same corpus and knobs as prm_rollout.yaml; the only differences are `rounds`, `out_dir` and
# `eval_run_name`. Rounds 1-2 are excluded because later lintloop rounds hurt kernel quality,
# so the prefixes cut from them measure a degraded policy.
#
# A separate out_dir on purpose: prefixes.py writes with makedirs(exist_ok=True) + write_atomic
# and no guard, so pointing this at data/prm_rollout would overwrite the [0,1,2] build in place.
#
# `parts_glob` stays unrestricted -- run_tags drops the DeepSeek rows and `rounds` drops 1-2,
# which leaves exactly the 16 round-0 gpt-oss parts = 16 job B units.
prm_rollout:
  parts_glob: data/prm_v2/parts/*.jsonl
  splits_json: data/prm_v2/splits.json
  baseline_timing_json: /path/to/workdir/KernelBench/results/timing/H100/baseline_time_torch.json

  run_tags:
    gpt-oss-120b_kb6_lintloop_triton_v5_traced: go-l6

  source: cut
  rounds: [0]
  depths_per_group: 4
  min_rel_depth: 0.1
  max_rel_depth: 0.9
  min_list_size: 2
  # Inert on this corpus: 4 samples per problem, so lists_at_cap was 0 on the [0,1,2] build.
  max_list_size: 8
  train_selection: random
  prm_v1_checkpoint: null
  select_seed: 42

  K: 5
  min_rollouts: 3
  temperature: 0.6
  think_temperature: 1.0
  max_new_tokens: 16384
  gen_model: openai/gpt-oss-120b
  max_num_seqs: 64
  max_model_len: 40960
  prefixes_per_batch: 256

  eval_runs_dir: /path/to/workdir/KernelBench/runs
  eval_run_name: prm_rollout_l6_r0
  # NOT sized for this campaign -- job C only. ~1.0M evals over 4 shards is ~1,030 GPU-h each,
  # far past the 24 h wall clock; set it from the real count before submitting prm_eval.sh.
  eval_shards: 4
  num_correct_trials: 5
  num_perf_trials: 100
  eval_timeout: 300
  dedup_by_code_sha1: true

  label_mode: graded
  speedup_stat: min
  speedup_lo: 0.2
  speedup_hi: 4.0
  speed_quant: 0.1

  base_model: Qwen/Qwen3-Reranker-4B
  max_length: 16384
  depth_buckets: 4

  out_dir: data/prm_rollout_l6_r0
  num_workers: 8

  # v3: level 6 has no evals, so it is labelled by the ORM.
  label_source: imputed
  orm_checkpoint: reranker/data/checkpoints_listwise_kb_deepseek_gptoss_all_rounds_speed_moderate/final
  orm_lists_glob: reranker/data/lists_{train,val}_kb_deepseek_gptoss_all_rounds_speed_moderate.jsonl
  orm_max_length: 6144
  orm_reserve_ref_tokens: 1024
  orm_batch_size: 16
  curve_bins: 40
  curve_iters: 3
  offset_kappa: auto
  offset_clamp: 4.0
  use_anchors: true
  anchor_rounds: [0]
  calib_speed_quant: 0.0
