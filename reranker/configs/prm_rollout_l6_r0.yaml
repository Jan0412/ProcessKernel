# PRM rollout campaign over the gpt-oss KernelBench **level 6** run, round 0 only.
#   python -m reranker.src.prm.rollout.prefixes --config reranker/configs/prm_rollout_l6_r0.yaml
#   CONFIG=reranker/configs/prm_rollout_l6_r0.yaml sbatch scripts/prm_rollout.sh
#
# Same corpus and knobs as prm_rollout.yaml; the only differences are `rounds`, `out_dir` and
# `eval_run_name`. Rounds 1-2 are excluded because later lintloop rounds hurt kernel quality,
# so the prefixes cut from them measure a degraded policy.
#
# A separate out_dir on purpose: prefixes.py writes with makedirs(exist_ok=True) + write_atomic
# and no guard, so pointing this at data/prm_rollout would overwrite the [0,1,2] build in place.
#
# `parts_glob` stays unrestricted -- run_tags drops the DeepSeek rows and `rounds` drops 1-2,
# which leaves exactly the 16 round-0 gpt-oss parts = 16 job B units.
prm_rollout:
  parts_glob: data/prm_v2/parts/*.jsonl
  splits_json: data/prm_v2/splits.json
  baseline_timing_json: /path/to/workdir/KernelBench/results/timing/H100/baseline_time_torch.json

  run_tags:
    gpt-oss-120b_kb6_lintloop_triton_v5_traced: go-l6

  source: cut
  rounds: [0]
  depths_per_group: 4
  min_rel_depth: 0.1
  max_rel_depth: 0.9
  min_list_size: 2
  # Inert on this corpus: 4 samples per problem, so lists_at_cap was 0 on the [0,1,2] build.
  max_list_size: 8
  train_selection: random
  prm_v1_checkpoint: null
  select_seed: 42

  K: 5
  min_rollouts: 3
  temperature: 0.6
  think_temperature: 1.0
  max_new_tokens: 16384
  gen_model: openai/gpt-oss-120b
  max_num_seqs: 64
  max_model_len: 40960
  prefixes_per_batch: 256

  eval_runs_dir: /path/to/workdir/KernelBench/runs
  eval_run_name: prm_rollout_l6_r0
  # NOT sized for this campaign -- job C only. ~1.0M evals over 4 shards is ~1,030 GPU-h each,
  # far past the 24 h wall clock; set it from the real count before submitting prm_eval.sh.
  eval_shards: 4
  num_correct_trials: 5
  num_perf_trials: 100
  eval_timeout: 300
  dedup_by_code_sha1: true

  label_mode: graded
  speedup_stat: min
  speedup_lo: 0.2
  speedup_hi: 4.0
  speed_quant: 0.1

  base_model: Qwen/Qwen3-Reranker-4B
  max_length: 16384
  depth_buckets: 4

  out_dir: data/prm_rollout_l6_r0
  num_workers: 8

  # v3: level 6 has no evals, so it is labelled by the ORM.
  label_source: imputed
  orm_checkpoint: reranker/data/checkpoints_listwise_kb_deepseek_gptoss_all_rounds_speed_moderate/final
  # `data/`, NOT `reranker/data/`: this one goes through _resolve, which prepends reranker/,
  # so the shipped prefix doubled it and matched nothing. (orm_checkpoint below is used raw,
  # hence its different prefix.) Ends at _speed_moderate so the model-suffixed siblings
  # (_dscoder13b, _qwen*) cannot match -- exactly two files.
  orm_lists_glob: data/lists_*_kb_deepseek_gptoss_all_rounds_speed_moderate.jsonl
  orm_max_length: 6144
  orm_reserve_ref_tokens: 1024
  orm_batch_size: 16
  # The ORM trained on kb6, and its listwise build kept the lists holding correct kernels, so
  # excluding what it saw leaves a fit sample that is 99.6% target 0 and a curve pinned to
  # [0.0000, 0.0422]. Fitting on everything gives [0.0005, 0.6145] -- level 1's own curve is
  # [0.0000, 0.6302]. Level 1 needs no such key: it has 0 seen anchors.
  curve_fit_orm_seen: true
  curve_bins: 40
  curve_iters: 16
  offset_kappa: auto
  offset_clamp: 4.0
  use_anchors: true
  # Wider than `rounds` on purpose. A prefix cut from round 1-2 measures a degraded policy and
  # is excluded; an anchor is only a (score, target) pair, and the offsets need many per
  # problem -- round 0 alone gives 3.98, where var_i swamps the between-problem spread and
  # tau2 floors to 0, i.e. every offset is 0. Rounds 0-2 give 8.35 (level 1 has 34.99).
  anchor_rounds: [0, 1, 2]
  calib_speed_quant: 0.0
  # Level 6 is labelled by the ORM, so a problem no anchor of which ever passed hands its lists
  # an order nothing measured. Scored against level 1's truth, thinned to this campaign's 8.35
  # anchors/problem: catches ~60% of those lists at the cost of ~16% of the good ones. Taken
  # deliberately -- fewer, cleaner labels beat more noisy ones.
  drop_dead_problems: true
