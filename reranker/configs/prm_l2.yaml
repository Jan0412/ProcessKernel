# PRM labeling build over the gpt-oss KernelBench **level 2** run — prm_plan/PLAN.md §7.
#   sbatch reranker/scripts/build_prm_slurm.sh reranker/configs/prm_l2.yaml
#   python -m reranker.src.prm.splits --config reranker/configs/prm_l2.yaml
#   python -m reranker.src.prm.stats  --config reranker/configs/prm_l2.yaml
#
# One level per build, and so one per out_dir. Not tidiness: `splits.json` is keyed
# "level:problem" and every v2 campaign reads the splits of the build it was cut from, while
# stage.py refuses a campaign spanning levels (EvalConfig takes one). Sharing a build between
# level 1 and level 2 would also mean a rebuild for one of them re-reads a `baseline_sha1`
# that _check_resume compares — and that file is being rewritten right now (FP32).
prm:
  run_dirs:
    - /path/to/workdir/KernelBench/runs/gpt-oss-120b_level2_lintloop_triton_v5_traced
  rounds: [0, 1, 2]
  # The FP32 baseline, which is what the evals measure. Its level1 (99) and level2 (100)
  # entries are complete; only level6 is still being written.
  baseline_timing_json: /path/to/workdir/KernelBench/results/timing/H100/baseline_time_torch.json
  label_mode: graded
  speedup_stat: min
  speedup_lo: 0.2
  speedup_hi: 4.0
  speed_quant: 0.0          # 0 = off: the speed ladder stays continuous, not stepped in 0.1s
  prose_lines_per_chunk: 1
  code_steps_per_chunk: 1
  min_frac: 0.0
  tokenizer: Qwen/Qwen3-Reranker-4B
  max_length: 32768
  split_ratios: [0.7, 0.15, 0.15]
  split_seed: 42
  out_dir: data/prm_l2
  num_workers: 8
  max_shards: null
