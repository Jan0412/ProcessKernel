# Shared base for PRM listwise training — prm_plan/PLAN_TRAINER.md.
#
# NOT trainable on its own: it names no backbone and no output paths. Pick an arm:
#   prm_train_qwen25coder05b.yaml       prm_train_qwen3base06b.yaml
# each of which is this file plus `_base:` and its own model/output/run_name.
#
#   CONFIG=reranker/configs/prm_train_qwen3base06b.yaml sbatch scripts/prm_train.sh
#
# `_base: prm_rollout.yaml` inherits the campaign section whole, so the trainer reads the
# exact out_dir / parts_glob / max_length / depth bands job D wrote. Previously these were
# copied into this file and a parity test kept the copy honest; inheriting removes the copy.

_base: prm_rollout.yaml

model:
  # base_model comes from the arm. head_type and attention are shared so a difference
  # between arms is attributable to the backbone and not to how it was run.
  head_type: seq_cls
  # sdpa, not eager: fused attention, and what both ORM configs use. eager materializes the
  # full attention matrix and buys nothing here.
  attn_implementation: sdpa
  # model.max_length is deliberately left at its default: the PRM encodes through
  # prm_rollout.max_length, and setting it here would imply this job reads it.

train:
  # output_dir comes from the arm, so the arms never clobber each other.
  epochs: 3
  # 2.0e-5, not the ORM's 1.0e-5, because the effective batch is 4x theirs (below).
  lr: 2.0e-5
  # 1, measured: the ORM's collator pads every candidate to the longest in the batch, so
  # throughput gets WORSE as this grows (1.10 -> 0.79 -> 0.53 lists/s at 1/2/4). Raise it
  # only alongside a length-grouped sampler.
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 8
  # Effective batch = 1 x 32 x 4 GPUs = 128. The ORM's 32 was tuned for 12.9-item lists
  # carrying ~40 ranking pairs each; PRM lists hold ~3.2 items and ~3 pairs, so the same
  # list count is a far noisier gradient. 128 lists puts the pairs-per-step back in range.
  gradient_accumulation_steps: 32
  # 0.03, the ORM's measured value: 0.01 was ~12 steps and the grad_norm opens high.
  warmup_ratio: 0.03
  weight_decay: 0.01
  bf16: true
  # Mandatory, not an economy: one list is up to 8 prefixes x 16,384 tokens in one forward.
  gradient_checkpointing: true
  logging_steps: 10
  # ~951 steps/epoch at effective batch 128, so 3 epochs is ~2,854 steps and 75 gives ~38
  # evals -- enough to locate the turn, which the ORM found at ~epoch 2.5 of 8.
  eval_steps: 75
  save_steps: 75                   # must stay a multiple of eval_steps for load_best_model_at_end
  save_total_limit: 2
  # The override's whole point: eval_pr_auc is pointwise and this trainer never computes it,
  # so load_best_model_at_end would never find its key.
  metric_for_best_model: eval_prm_ndcg
  greater_is_better: true
  seed: 42
  # 16 per rank, matched by --cpus-per-task=72 in prm_train.sh. Each worker forks the
  # dataset's Source map, so this is a memory multiplier and not only a throughput knob.
  dataloader_num_workers: 16

prm_train:
  sigma: 1.0
  loss_alpha: 0.5
  # The val split is ~26k lists; uncapped that is ~1h per eval against ~14h of training, so
  # the measurement would cost more than the thing measured. 2,000 lists is ~10k ranking
  # pairs -- SE ~0.5pp overall, ~1pp per depth band, which is far tighter than the effect.
  eval_max_lists: 2000
  # Fixed across arms on purpose: two backbones scored on different val subsets are not
  # comparable, and nothing in the numbers would say so.
  eval_subsample_seed: 42

mlflow:
  # One experiment for both arms so they are comparable in one view; the arm sets run_name.
  db_file: mlflow.db
  experiment: KernelReranker_PRM_kb6
  run_name: null
