# Smoke build — one run, one round, one shard (PLAN §12 step 2). Same knobs as
# prm_config.yaml so the smoke output is a sample of the real thing, not a different build.
#   python -m reranker.src.prm.build --config reranker/configs/prm_smoke.yaml
prm:
  run_dirs:
    - /path/to/workdir/KernelBench/runs/DeepSeek-V4-Flash_kb6_lintloop_triton_v5_traced
  rounds: [0]

  baseline_timing_json: /path/to/workdir/KernelBench/results/timing/H100/baseline_time_torch.json

  label_mode: graded
  speedup_stat: min
  speedup_lo: 0.2
  speedup_hi: 4.0
  speed_quant: 0.1

  prose_lines_per_chunk: 1
  code_steps_per_chunk: 1
  min_frac: 0.0

  tokenizer: Qwen/Qwen3-Reranker-4B
  max_length: 16384

  out_dir: data/prm_smoke
  num_workers: 1
  max_shards: 1
